name: R

on:
  workflow_dispatch:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15-intel
    strategy:
      fail-fast: false
      matrix:
        include:
          - r-version: '3.6.3'
            cran-snapshot: '2020-02-29'
          - r-version: '4.1.1'
            cran-snapshot: '2021-08-10'

    steps:
      - uses: actions/checkout@v3
      - name: Set up R ${{ matrix.r-version }}
        uses: r-lib/actions/setup-r@a51a8012b0aab7c32ef9d19bf54da93f3254335e # v2.12.0
        with:
          r-version: ${{ matrix.r-version }}
      - name: Configure pinned CRAN snapshot
        env:
          CRAN_REPOSITORY: https://packagemanager.posit.co/cran/${{ matrix.cran-snapshot }}/
        run: echo 'options(repos = c(CRAN = Sys.getenv("CRAN_REPOSITORY")))' >> "$HOME/.Rprofile"
      - name: Install dependencies
        working-directory: camb
        run: |
          install.packages(c("remotes", "rcmdcheck"))
          remotes::install_deps(dependencies = TRUE)
        shell: Rscript {0}
      - name: Check
        working-directory: camb
        run: rcmdcheck::rcmdcheck(args = "--no-manual", error_on = "error")
        shell: Rscript {0}
